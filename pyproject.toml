[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django_vite_plugin"
version = "4.1.1_dev"
description = "Django integration with Vite"
authors = [{ name = "Stepan Stanchev", email = "you@example.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["django>=3.10"]

[tool.hatch.build.targets.wheel]
packages = ["django/src/django_vite_plugin"]